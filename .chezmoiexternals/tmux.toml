{{/* renovate: datasource=github-tags depName=tmux-plugins/tpm */}}
{{- $tpmVersion := "v3.1.0" -}}

[".tmux/plugins/tpm"]
    type = "archive"
    url = "https://github.com/tmux-plugins/tpm/archive/refs/tags/{{ $tpmVersion }}.zip"
    exact = true
    stripComponents = 1

{{/* renovate: datasource=git-refs depName=tmux-plugins/tmux-sensible packageName=https://github.com/tmux-plugins/tmux-sensible.git currentValue=master */}}
