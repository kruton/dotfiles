{{/* renovate: datasource=github-releases depName=kruton/moo-lsp-rs */}}
{{- $mooLspVersion := "v0.3.0" -}}
{{/* renovate: datasource=github-tags depName=junegunn/vim-plug */}}
{{- $vimPlugVersion := "0.14.0" -}}
{{/* renovate: datasource=git-refs depName=altercation/vim-colors-solarized packageName=https://github.com/altercation/vim-colors-solarized currentValue=master */}}
{{- $vimColorsSolarizedCommit := "528a59f26d12278698bb946f8fb82a63711eec21" -}}
{{/* renovate: datasource=github-tags depName=folke/lazy.nvim */}}
{{- $lazyVersion := "v11.17.5" -}}

{{- $mooLspOs := .chezmoi.os | replaceAllRegex "windows" "win32" -}}
{{- $mooLspArch := .chezmoi.arch | replaceAllRegex "amd64" "x64" | replaceAllRegex "^arm$" "armhf" -}}
{{- if eq .chezmoi.os "windows" }}
[".local/bin/moo-lsp-rs.exe"]
    type = "archive-file"
    url = "https://github.com/kruton/moo-lsp-rs/releases/download/{{ $mooLspVersion }}/moo-lsp-rs-{{ $mooLspOs }}-{{ $mooLspArch }}.zip"
    path = "{{ $mooLspOs }}-{{ $mooLspArch }}/moo-lsp-rs.exe"
{{- else }}
[".local/bin/moo-lsp-rs"]
    type = "archive-file"
    url = "https://github.com/kruton/moo-lsp-rs/releases/download/{{ $mooLspVersion }}/moo-lsp-rs-{{ $mooLspOs }}-{{ $mooLspArch }}.tar.gz"
    path = "{{ $mooLspOs }}-{{ $mooLspArch }}/moo-lsp-rs"
{{- end }}
[".vim/autoload/plug.vim"]
    type = "file"
    url = "https://raw.githubusercontent.com/junegunn/vim-plug/{{ $vimPlugVersion }}/plug.vim"
[".vim/colors/solarized.vim"]
    type = "file"
    url = "https://raw.githubusercontent.com/altercation/vim-colors-solarized/{{ $vimColorsSolarizedCommit }}/colors/solarized.vim"
[".local/share/nvim/lazy/lazy.nvim"]
    type = "git-repo"
    url = "https://github.com/folke/lazy.nvim.git"
    revision = "{{ $lazyVersion }}"
