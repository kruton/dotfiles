{{/* renovate: datasource=github-tags depName=kruton/nvim-lambdamoo */}}
{{- $nvimLambdamooVersion := "v0.1.4" -}}

[".local/bin/mise"]
    type = "archive-file"
    url = "https://github.com/jdx/mise/releases/download/{{ $miseVersion }}/mise-{{ $miseVersion }}-{{ .chezmoi.os | replaceAllRegex "darwin" "macos" }}-{{ .chezmoi.arch | replaceAllRegex "amd64" "x64" }}.tar.gz"
    stripComponents = 1
    path = "bin/mise"
{{- $mooLspOs := .chezmoi.os | replaceAllRegex "windows" "win32" -}}
{{- $mooLspArch := .chezmoi.arch | replaceAllRegex "amd64" "x64" | replaceAllRegex "^arm$" "armhf" -}}
{{- if eq .chezmoi.os "windows" }}
[".local/bin/moo-lsp-rs.exe"]
    type = "archive-file"
    url = "https://github.com/kruton/moo-lsp-rs/releases/download/{{ $mooLspVersion }}/moo-lsp-rs-{{ $mooLspOs }}-{{ $mooLspArch }}.zip"
    path = "{{ $mooLspOs }}-{{ $mooLspArch }}/moo-lsp-rs.exe"
{{- else }}
[".local/bin/moo-lsp-rs"]
    type = "archive-file"
    url = "https://github.com/kruton/moo-lsp-rs/releases/download/{{ $mooLspVersion }}/moo-lsp-rs-{{ $mooLspOs }}-{{ $mooLspArch }}.tar.gz"
    path = "{{ $mooLspOs }}-{{ $mooLspArch }}/moo-lsp-rs"
{{- end }}
[".fzf"]
    type = "archive"
    url = "https://github.com/junegunn/fzf/archive/refs/tags/v{{ $fzfVersion }}.tar.gz"
    exact = true
    stripComponents = 1
[".fzf/bin"]
    type = "archive"
    exact = true
    url = "https://github.com/junegunn/fzf/releases/download/v{{ $fzfVersion }}/fzf-{{ $fzfVersion }}-{{ .chezmoi.os }}_{{ .chezmoi.arch }}.tar.gz"
[".fzf-tab-completion"]
    type = "archive"
    url = "https://github.com/lincheney/fzf-tab-completion/archive/{{ $fzfTabCompletionCommit }}.zip"
    exact = true
    stripComponents = 1
[".bash-preexec"]
    type = "archive"
    url = "https://github.com/rcaloras/bash-preexec/archive/refs/tags/{{ $bashPreexecVersion }}.zip"
    exact = true
    stripComponents = 1
[".dircolors-solarized"]
    type = "archive"
    url = "https://github.com/seebi/dircolors-solarized/archive/{{ $dircolorsSolarizedCommit }}.zip"
    exact = true
    stripComponents = 1
[".tmux/plugins/tpm"]
    type = "archive"
    url = "https://github.com/tmux-plugins/tpm/archive/refs/tags/{{ $tpmVersion }}.zip"
    exact = true
    stripComponents = 1
["bin/git-rebase-all"]
    type = "archive-file"
    url = "https://github.com/nornagon/git-rebase-all/archive/{{ $gitRebaseAllCommit }}.zip"
    stripComponents = 1
    path = "git-rebase-all"
["bin/projectdo"]
    type = "archive-file"
    url = "https://github.com/paldepind/projectdo/archive/refs/tags/{{ $projectdoVersion }}.zip"
    stripComponents = 1
    path = "projectdo"
[".rbenv"]
    type = "archive"
    url = "https://github.com/rbenv/rbenv/archive/refs/tags/v{{ $rbenvVersion }}.zip"
    stripComponents = 1
    refreshPeriod = "168h"
[".ruby-build"]
    type = "archive"
    url = "https://github.com/rbenv/ruby-build/archive/refs/tags/v{{ $rubyBuildVersion }}.zip"
    exact = true
    stripComponents = 1
    refreshPeriod = "168h"
[".vim/autoload/plug.vim"]
    type = "file"
    url = "https://raw.githubusercontent.com/junegunn/vim-plug/{{ $vimPlugVersion }}/plug.vim"
[".vim/colors/solarized.vim"]
    type = "file"
    url = "https://raw.githubusercontent.com/altercation/vim-colors-solarized/{{ $vimColorsSolarizedCommit }}/colors/solarized.vim"
[".local/share/nvim/site/pack/plugins/start/kanagawa.nvim"]
    type = "archive"
    url = "https://github.com/rebelot/kanagawa.nvim/archive/{{ $kanagawaCommit }}.zip"
    exact = true
    stripComponents = 1
[".local/share/nvim/site/pack/plugins/start/plenary.nvim"]
    type = "archive"
    url = "https://github.com/nvim-lua/plenary.nvim/archive/{{ $plenaryCommit }}.zip"
    exact = true
    stripComponents = 1
[".local/share/nvim/site/pack/plugins/start/inlay-hints.nvim"]
    type = "archive"
    url = "https://github.com/MysticalDevil/inlay-hints.nvim/archive/{{ $inlayHintsCommit }}.zip"
    exact = true
    stripComponents = 1
[".local/share/nvim/site/pack/plugins/start/nvim-lambdamoo"]
    type = "archive"
    url = "https://github.com/kruton/nvim-lambdamoo/archive/refs/tags/{{ $nvimLambdamooVersion }}.zip"
    exact = true
    stripComponents = 1
[".local/share/nvim/site/pack/plugins/start/xml2lua.nvim"]
    type = "archive"
    url = "https://github.com/a-usr/xml2lua.nvim/archive/{{ $xml2luaCommit }}.zip"
    exact = true
    stripComponents = 1

